plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}
base { archivesName = 'steve-v2-forge' }
minecraft {
    mappings channel: 'official', version: minecraft_version
    reobf = false
    copyIdeResources = false
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods {
                steve_v2 {
                    source sourceSets.main
                    source project(':agent-core').sourceSets.main
                }
            }
        }
        client {}
        server { args '--nogui' }
        gameTestServer {
            workingDirectory project.file('run-gametest')
            property 'forge.enabledGameTestNamespaces', 'steve_v2'
        }
    }
}
dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    compileOnly project(':agent-core')
}
// Ship the independent core in the mod JAR; Gson is provided by Minecraft.
tasks.named('jar', Jar).configure {
    from project(':agent-core').sourceSets.main.output
    from(rootProject.file('docs/ATTRIBUTION.md')) { into 'META-INF' }
    exclude 'com/steve/v2/forge/MigrationGameTests*.class'
    exclude 'data/steve_v2/structure/empty.nbt'
    manifest { attributes 'Implementation-Version': project.version }
}
sourceSets.each {
    def outputDir = layout.buildDirectory.dir("sourceSets/$it.name")
    it.output.resourcesDir = outputDir
    it.java.destinationDirectory = outputDir
}

// Dev-only integration tests. They are excluded from normal release JARs.
if (providers.gradleProperty('gameTests').isPresent()) {
    sourceSets.main.java.srcDir 'src/gametest/java'
    def generatedTests = layout.buildDirectory.dir('generated/gameTestResources')
    sourceSets.main.resources.srcDir generatedTests
    tasks.register('generateGameTestTemplate') {
        inputs.property 'templateHeight', 16
        outputs.dir generatedTests
        doLast {
            def target = generatedTests.get().file('data/steve_v2/structure/empty.nbt').asFile
            target.parentFile.mkdirs()
            target.withOutputStream { raw ->
                def output = new DataOutputStream(new java.util.zip.GZIPOutputStream(raw))
                output.writeByte(10); output.writeUTF('')
                output.writeByte(3); output.writeUTF('DataVersion'); output.writeInt(3955)
                output.writeByte(9); output.writeUTF('size'); output.writeByte(3); output.writeInt(3)
                output.writeInt(16); output.writeInt(16); output.writeInt(16)
                output.writeByte(9); output.writeUTF('palette'); output.writeByte(10); output.writeInt(1)
                output.writeByte(8); output.writeUTF('Name'); output.writeUTF('minecraft:air'); output.writeByte(0)
                for (name in ['blocks', 'entities']) {
                    output.writeByte(9); output.writeUTF(name); output.writeByte(10); output.writeInt(0)
                }
                output.writeByte(0); output.close()
            }
        }
    }
    tasks.named('processResources') { dependsOn 'generateGameTestTemplate' }
}
